spring.application.name=gerenciador-eventos
server.port=8080

# ---------- PostgreSQL (padrao) ----------
# Sobrescreva via variaveis de ambiente: DB_URL, DB_USER, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/eventos_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Para producao prefira migrations (Flyway/Liquibase) e ddl-auto=validate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---------- JWT ----------
# Segredo em Base64 (minimo 256 bits). Troque em producao via variavel JWT_SECRET.
app.jwt.secret=${JWT_SECRET:ZGVzYWZpby1yZXNpZGVuY2lhLWdlcmVuY2lhZG9yLWRlLWV2ZW50b3Mtand0LXNlY3JldC1rZXktMjAyNg==}
# Expiracao do token em milissegundos (padrao: 24h)
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------- CORS (frontend web) ----------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ---------- Swagger / OpenAPI ----------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ---------- Desempenho ----------
# Compacta (gzip) respostas JSON maiores que 1 KB: a lista de eventos trafega menos dados
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=1024
